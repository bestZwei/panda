<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>关机</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #f2f2f2;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    user-select: none;
  }
  .spinner {
    width: 64px;
    height: 64px;
    position: relative;
    margin-bottom: 34px;
    animation: spin 1.1s linear infinite;
  }
  .spinner i {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 6px;
    height: 6px;
    margin: -3px;
    border-radius: 50%;
    background: #fff;
    transform: rotate(calc(var(--i) * 30deg)) translateY(-30px);
    opacity: .15;
    animation: glow 1.1s linear infinite;
    animation-delay: calc(var(--i) * -0.0917s);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes glow { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
  h1 {
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 3px;
    margin: 0 0 16px;
  }
  .step {
    font-size: 13px;
    opacity: .72;
    min-height: 20px;
    letter-spacing: .5px;
  }
  .bar {
    width: 340px;
    height: 2px;
    background: rgba(255, 255, 255, .18);
    margin-top: 30px;
    overflow: hidden;
  }
  .fill {
    height: 100%;
    width: 0;
    background: #fff;
    animation: fill 8.8s linear forwards;
  }
  @keyframes fill { to { width: 100%; } }
  body.wrapup { animation: fadeout .7s ease-in forwards; }
  @keyframes fadeout { to { opacity: 0; } }
</style>
</head>
<body>
  <div class="spinner">
    <i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i>
    <i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i>
    <i style="--i:8"></i><i style="--i:9"></i><i style="--i:10"></i><i style="--i:11"></i>
  </div>
  <h1>正在关机</h1>
  <div class="step" id="step">正在保存系统设置…</div>
  <div class="bar"><div class="fill"></div></div>
  <script>
    var steps = [
      '正在保存系统设置…',
      '正在结束后台进程…',
      '正在注销当前用户…',
      '正在停止系统服务…',
      '正在清除临时文件…',
      '即将完成…'
    ];
    var i = 0;
    var el = document.getElementById('step');
    var timer = setInterval(function () {
      i++;
      if (i >= steps.length) {
        clearInterval(timer);
        el.textContent = '正在关闭电源…';
        document.body.classList.add('wrapup');
      } else {
        el.textContent = steps[i];
      }
    }, 1500);
  </script>
</body>
</html>
